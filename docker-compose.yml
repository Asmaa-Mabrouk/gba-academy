# Local stack: PostgreSQL + API + web.   docker compose up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: gba, POSTGRES_USER: gba, POSTGRES_PASSWORD: gba }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gba"], interval: 5s, retries: 10 }
  api:
    build: ./services/api
    environment:
      DB_URL: jdbc:postgresql://db:5432/gba
      DB_USER: gba
      DB_PASSWORD: gba
      JWT_SECRET: local-dev-secret-local-dev-secret-0123456789
      CORS_ORIGINS: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
  web:
    build:
      context: ./apps/web
      args: { NEXT_PUBLIC_API_MODE: http, NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  dbdata:
